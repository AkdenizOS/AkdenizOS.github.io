name: Validate showcase

on:
  pull_request:
    paths:
      - showcase.json
      - .github/workflows/validate-showcase.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check showcase.json
        env:
          GH_TOKEN: ${{ github.token }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: python3 .github/scripts/validate_showcase.py
